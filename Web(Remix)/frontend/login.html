<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Shopping</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Bricolage+Grotesque:wght@500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="banner-section">
        <h1 class="banner-title">ONLINE SHOPPING</h1>
        <img src="images/banner.png" alt="Online Shopping" class="banner-img"
             onerror="this.style.display='none'">
    </section>
    <section class="form-section">
        <div class="form-container">
            <h2 class="form-title">Login</h2>
            <p class="form-subtitle">It's free to login and only take a minute.</p>

            <div class="auth-msg" id="authMsg"></div>

            <form onsubmit="event.preventDefault(); login();">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password" required>
                </div>

                <div class="forgot-link">
                    <a href="#">Forgot Your Password?</a>
                </div>

                <button type="submit" class="btn-primary">Login</button>
            </form>

            <p class="divider-text">Login with</p>

            <div class="social-buttons">
                <button type="button" class="btn-social btn-facebook" onclick="showToast('Facebook Login', 'info')">
                    <span>f</span> Facebook
                </button>
                <button type="button" class="btn-social btn-google" onclick="showToast('Google Login', 'info')">
                    <span>◉</span> Google
                </button>
                <button type="button" class="btn-social btn-line" onclick="showToast('Line Login', 'info')">
                    <span>💬</span> Line
                </button>
            </div>

            <a href="home.html" class="btn-cancel">Cancel</a>

            <p class="switch-link">
                ยังไม่มีบัญชี? <a href="signup.html">สมัครสมาชิก</a>
            </p>
        </div>
    </section>

    <div class="toast" id="toast"></div>

    <script>
       
        var API_BASE = 'https://1270dhw9-3000.asse.devtunnels.ms/api';

        function setCurrentUser(user) { localStorage.setItem('currentUser', JSON.stringify(user)); }

        var toastTimer;
        function showToast(msg, type) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show ' + (type || '');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() { t.className = 'toast'; }, 2500);
        }

        function showAuthMsg(msg, type) {
            var el = document.getElementById('authMsg');
            el.textContent = msg;
            el.className = 'auth-msg ' + type;
        }

        function login() {
            var u = document.getElementById('username').value.trim();
            var p = document.getElementById('password').value;

            if (!u || !p) {
                showAuthMsg('กรอกข้อมูลให้ครบ', 'error');
                return;
            }

            var submitBtn = document.querySelector('.btn-primary');
            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังเข้าสู่ระบบ...';

            fetch(API_BASE + '/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            })
            .then(function(res) {
                return res.json().then(function(data) { return { ok: res.ok, data: data }; });
            })
            .then(function(result) {
                if (!result.ok) {
                    showAuthMsg(' ' + (result.data.error || 'เข้าสู่ระบบไม่สำเร็จ'), 'error');
                    return;
                }
                setCurrentUser(result.data.user);
                showAuthMsg(' เข้าสู่ระบบสำเร็จ! กำลังไปหน้าหลัก...', 'success');
                setTimeout(function() {
                    window.location.href = 'home.html';
                }, 1000);
            })
            .catch(function() {
                showAuthMsg(' การล็อคอินล้มเหลว', 'error');
            })
            .finally(function() {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            });
        }
    </script>

</body>
</html>
