<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Online Shopping</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Bricolage+Grotesque:wght@500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="banner-section">
        <h1 class="banner-title">ONLINE SHOPPING</h1>
        <img src="images/banner.png" alt="Online Shopping" class="banner-img"
             onerror="this.style.display='none'">
    </section>

    <!-- ส่วนขวา: ฟอร์ม -->
    <section class="form-section">
        <div class="form-container">
            <h2 class="form-title">Sign Up</h2>
            <p class="form-subtitle">It's free to signup and only take a minute.</p>

            <div class="auth-msg" id="authMsg"></div>

            <form onsubmit="event.preventDefault(); signup();">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                </div>

                <button type="submit" class="btn-primary">Sign Up</button>
            </form>

            <p class="divider-text">Sign Up with</p>

            <div class="social-buttons">
                <button type="button" class="btn-social btn-facebook" onclick="showToast('Facebook Sign Up', 'info')">
                    <span>f</span> Facebook
                </button>
                <button type="button" class="btn-social btn-google" onclick="showToast('Google Sign Up', 'info')">
                    <span>◉</span> Google
                </button>
                <button type="button" class="btn-social btn-line" onclick="showToast('Line Sign Up', 'info')">
                    <span>💬</span> Line
                </button>
            </div>

            <a href="home.html" class="btn-cancel">Cancel</a>

            <p class="switch-link">
                มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a>
            </p>
        </div>
    </section>

    <div class="toast" id="toast"></div>

    <script>
        var API_BASE = 'https://1270dhw9-3000.asse.devtunnels.ms/api';

        var toastTimer;
        function showToast(msg, type) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show ' + (type || '');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() { t.className = 'toast'; }, 2500);
        }

        function showAuthMsg(msg, type) {
            var el = document.getElementById('authMsg');
            el.textContent = msg;
            el.className = 'auth-msg ' + type;
        }

        function signup() {
            var u = document.getElementById('username').value.trim();
            var p = document.getElementById('password').value;
            var p2 = document.getElementById('confirmPassword').value;

            if (!u || !p || !p2) {
                showAuthMsg('กรุณากรอกข้อมูลให้ครบ', 'error');
                return;
            }

            if (p.length < 4) {
                showAuthMsg('รหัสผ่านต้องอย่างน้อย 4 ตัว', 'error');
                return;
            }

            if (p !== p2) {
                showAuthMsg(' รหัสผ่านไม่ตรงกัน', 'error');
                return;
            }

            var submitBtn = document.querySelector('.btn-primary');
            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังสมัคร...';

            fetch(API_BASE + '/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            })
            .then(function(res) {
                return res.json().then(function(data) { return { ok: res.ok, data: data }; });
            })
            .then(function(result) {
                if (!result.ok) {
                    showAuthMsg(' ' + (result.data.error || 'สมัครไม่สำเร็จ'), 'error');
                    return;
                }
                showAuthMsg(' สมัครสำเร็จ! กำลังไปหน้า Login...', 'success');
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 1200);
            })
            .catch(function() {
                showAuthMsg('การล็อคอินล้มเหลว', 'error');
            })
            .finally(function() {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign Up';
            });
        }
    </script>

</body>
</html>
