<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตะกร้าสินค้า - Online Shopping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
  body { background: #fff; color: #333; line-height: 1.7; }
  .navbar { background: #f8dfff; padding: 1rem 5%; }
  .nav-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
  .logo { display: flex; align-items: center; gap: 0.6rem; color: #9c00b4; font-weight: 600; font-size: 1.1rem; text-decoration: none; }
  .logo-icon { background: #e91e8c; padding: 8px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .logo-icon svg { width: 20px; height: 20px; color: #fff; }
  .nav-menu { display: flex; gap: 2.5rem; flex-wrap: wrap; }
  .nav-link { color: #7b0094; text-decoration: none; font-weight: 500; font-size: 1rem; }
  .nav-icons { display: flex; gap: 1.2rem; align-items: center; }
  .nav-icons a { color: #7b0094; display: flex; align-items: center; position: relative; }
  .nav-icons svg { width: 24px; height: 24px; }
  .cart-badge {
    position: absolute; top: -8px; right: -10px; background: #e91e8c; color: #fff;
    font-size: 0.65rem; font-weight: 600; border-radius: 999px; padding: 1px 5px;
    font-family: 'Kanit', sans-serif;
  }

  .cart-page { max-width: 1000px; margin: 2rem auto; padding: 0 5% 4rem; }
  .page-title { font-weight: 700; font-size: 1.7rem; color: #7b0094; margin-bottom: 1.5rem; }

  .cart-layout { display: grid; grid-template-columns: 1fr 340px; gap: 2rem; align-items: start; }

  .cart-items { display: flex; flex-direction: column; gap: 1rem; }
  .cart-item {
    display: grid; grid-template-columns: 70px 1fr auto auto; gap: 1rem; align-items: center;
    background: #fafafa; border-radius: 10px; padding: 1rem;
  }
  .item-icon {
    width: 70px; height: 70px; background: #f0f0f0; border-radius: 8px; display: flex; align-items: center;
    justify-content: center; font-size: 1.8rem;
  }
  .item-name { font-weight: 600; font-size: 0.98rem; color: #333; }
  .item-meta { font-size: 0.82rem; color: #888; margin-top: 0.15rem; }
  .item-price { font-size: 0.85rem; color: #9c00b4; margin-top: 0.3rem; font-weight: 600; }
  .item-qty { display: flex; align-items: center; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }
  .item-qty button { width: 30px; height: 30px; background: #f5f5f5; border: none; cursor: pointer; font-size: 1rem; color: #555; }
  .item-qty span { width: 34px; text-align: center; font-size: 0.9rem; }
  .item-remove {
    background: #fce8e6; color: #c5221f; border: none; width: 32px; height: 32px; border-radius: 6px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .item-remove svg { width: 16px; height: 16px; }

  .cart-empty { text-align: center; padding: 4rem 1rem; }
  .cart-empty p { color: #999; margin-bottom: 1.5rem; }
  .cart-empty a {
    display: inline-block; background: linear-gradient(90deg, #9c00b4, #e91e8c); color: #fff; text-decoration: none;
    padding: 0.8rem 1.8rem; border-radius: 8px; font-weight: 600;
  }

  .summary-box { background: #fdf0ff; border-radius: 12px; padding: 1.6rem; position: sticky; top: 1.5rem; }
  .summary-box h3 { color: #7b0094; font-size: 1.1rem; margin-bottom: 1.2rem; font-weight: 700; }
  .summary-row { display: flex; justify-content: space-between; font-size: 0.92rem; color: #555; margin-bottom: 0.7rem; }
  .summary-row.total { font-weight: 700; font-size: 1.05rem; color: #333; border-top: 1px solid #e5c7ef; padding-top: 0.8rem; margin-top: 0.6rem; }
  .shipping-note { font-size: 0.78rem; color: #999; margin-top: -0.3rem; margin-bottom: 0.9rem; }
  .btn-checkout {
    width: 100%; padding: 0.9rem; background: linear-gradient(90deg, #7b0094, #9c00b4); color: #fff; border: none;
    border-radius: 8px; font-weight: 600; font-size: 1rem;
    cursor: pointer; margin-top: 0.6rem; transition: opacity 0.2s;
  }
  .btn-checkout:hover { opacity: 0.92; }
  .btn-checkout:disabled { opacity: 0.6; cursor: not-allowed; }
  .login-note { font-size: 0.8rem; color: #c5221f; margin-top: 0.8rem; text-align: center; }
  .login-note a { color: #7b0094; font-weight: 600; }

  .toast {
    position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px);
    background: #333; color: #fff; padding: 0.8rem 1.5rem; border-radius: 8px; font-size: 0.9rem;
    z-index: 9999; opacity: 0; transition: all 0.3s ease; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.success { background: #059669; }
  .toast.error { background: #dc2626; }

  @media (max-width: 800px) {
    .cart-layout { grid-template-columns: 1fr; }
    .cart-item { grid-template-columns: 50px 1fr; grid-template-rows: auto auto; }
    .item-qty, .item-remove { grid-column: 2; }
    .item-icon { width: 50px; height: 50px; font-size: 1.4rem; }
  }

  /* ===== (Recommendation) ===== */
  .cart-rec-section { margin-top: 2.5rem; }
  .cart-rec-title {
    font-weight: 700; font-size: 1.25rem;
    color: #7b0094; margin-bottom: 1.1rem;
  }
  .cart-rec-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.2rem; }
  .rec-card {
    background: #fdf0ff; border-radius: 10px; padding: 1rem; cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .rec-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(156, 0, 180, 0.12); }
  .rec-card-img {
    aspect-ratio: 1; background: #f3e0fa; border-radius: 8px; display: flex; align-items: center;
    justify-content: center; overflow: hidden; margin-bottom: 0.6rem;
  }
  .rec-card-img img { width: 100%; height: 100%; object-fit: contain; padding: 0.5rem; }
  .rec-card-icon { font-size: 1.6rem; }
  .rec-card-name {
    font-weight: 600; font-size: 0.85rem; color: #333;
    margin-bottom: 0.25rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .rec-card-price { font-weight: 700; font-size: 0.9rem; color: #9c00b4; }
  @media (max-width: 800px) {
    .cart-rec-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<!-- ===== Navbar ===== -->
<header class="navbar">
  <div class="nav-container">
    <a href="home.html" class="logo">
      <span class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
      </span>
      <span>ONLINE SHOPPING</span>
    </a>
    <nav class="nav-menu">
      <a href="home.html" class="nav-link">Home</a>
      <a href="#" class="nav-link">About</a>
      <a href="home.html#products" class="nav-link">Shop</a>
      <a href="#" class="nav-link">Contect</a>
    </nav>
    <div class="nav-icons">
      <a href="login.html" aria-label="Account">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
      </a>
      <a href="cart.html" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
    </div>
  </div>
</header>

<!-- ===== Cart Page ===== -->
<main class="cart-page">
  <h1 class="page-title">ตะกร้าสินค้าของคุณ</h1>
  <div id="cartContent"></div>
  <section class="cart-rec-section" id="cartRecSection" style="display:none;">
    <h2 class="cart-rec-title">แนะนำเพิ่มเติมสำหรับคุณ</h2>
    <div class="cart-rec-grid" id="cartRecGrid"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script src="recommend.js"></script>
<script>
  var API_BASE = 'https://1270dhw9-3000.asse.devtunnels.ms/api';
  var CART_KEY = 'cart';
  var CURRENT_USER_KEY = 'currentUser';
  var SHIPPING_THRESHOLD = 100;
  var SHIPPING_FEE = 5;

  function getCart() {
    try { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); } catch (e) { return []; }
  }
  function saveCart(cart) {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    updateCartBadge();
  }
  function updateCartBadge() {
    var cart = getCart();
    var count = cart.reduce(function (sum, item) { return sum + item.qty; }, 0);
    var badge = document.getElementById('cartBadge');
    badge.textContent = count;
    badge.style.display = count > 0 ? 'block' : 'none';
  }
  function getCurrentUser() {
    try { return JSON.parse(localStorage.getItem(CURRENT_USER_KEY) || 'null'); } catch (e) { return null; }
  }

  var toastTimer;
  function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (type || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast'; }, 2500);
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function calcSubtotal(cart) {
    return cart.reduce(function (sum, item) { return sum + item.price * item.qty; }, 0);
  }
  function loadCartRecommendations(cart) {
    var section = document.getElementById('cartRecSection');
    var grid = document.getElementById('cartRecGrid');
    if (!cart.length) {
      section.style.display = 'none';
      return;
    }
    var ids = cart.map(function (item) { return item.id; });
    RCM.fetchRecommendations({ cartIds: ids, limit: 4 })
      .then(function (data) {
        if (!data.recommendations || data.recommendations.length === 0) {
          section.style.display = 'none';
          return;
        }
        grid.innerHTML = data.recommendations.map(RCM.recCardHtml).join('');
        section.style.display = 'block';
      })
      .catch(function () {
        section.style.display = 'none';
      });
  }

  function render() {
    var cart = getCart();
    var content = document.getElementById('cartContent');
    loadCartRecommendations(cart);

    if (cart.length === 0) {
      content.innerHTML =
        '<div class="cart-empty">' +
          '<p>ยังไม่มีสินค้าในตะกร้าของคุณ</p>' +
          '<a href="home.html">เลือกซื้อสินค้า</a>' +
        '</div>';
      updateCartBadge();
      return;
    }

    var subtotal = calcSubtotal(cart);
    var shipping = subtotal >= SHIPPING_THRESHOLD ? 0 : SHIPPING_FEE;
    var total = subtotal + shipping;
    var user = getCurrentUser();

    var itemsHtml = cart.map(function (item) {
      var metaParts = [];
      if (item.color) metaParts.push('สี: ' + escapeHtml(item.color));
      if (item.size) metaParts.push('ไซส์: ' + escapeHtml(item.size));
      return (
        '<div class="cart-item">' +
          '<div class="item-icon">🛍️</div>' +
          '<div>' +
            '<div class="item-name">' + escapeHtml(item.name) + '</div>' +
            (metaParts.length ? '<div class="item-meta">' + metaParts.join(' · ') + '</div>' : '') +
            '<div class="item-price">$' + item.price.toFixed(2) + ' / ชิ้น</div>' +
          '</div>' +
          '<div class="item-qty">' +
            '<button type="button" onclick="changeItemQty(\'' + item.key + '\', -1)">-</button>' +
            '<span>' + item.qty + '</span>' +
            '<button type="button" onclick="changeItemQty(\'' + item.key + '\', 1)">+</button>' +
          '</div>' +
          '<button type="button" class="item-remove" title="ลบ" onclick="removeItem(\'' + item.key + '\')">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>' +
          '</button>' +
        '</div>'
      );
    }).join('');

    var summaryHtml =
      '<div class="summary-box">' +
        '<h3>สรุปคำสั่งซื้อ</h3>' +
        '<div class="summary-row"><span>ยอดรวมสินค้า</span><span>$' + subtotal.toFixed(2) + '</span></div>' +
        '<div class="summary-row"><span>ค่าจัดส่ง</span><span>' + (shipping === 0 ? 'ฟรี' : '$' + shipping.toFixed(2)) + '</span></div>' +
        (shipping > 0 ? '<div class="shipping-note">ซื้อเพิ่มอีก $' + (SHIPPING_THRESHOLD - subtotal).toFixed(2) + ' รับส่งฟรี</div>' : '<div class="shipping-note">คุณได้รับสิทธิ์ส่งฟรีแล้ว 🎉</div>') +
        '<div class="summary-row total"><span>ยอดชำระทั้งหมด</span><span>$' + total.toFixed(2) + '</span></div>' +
        '<button type="button" class="btn-checkout" id="checkoutBtn" onclick="placeOrder()">ยืนยันสั่งซื้อ</button>' +
        (!user ? '<div class="login-note">กรุณา <a href="login.html">เข้าสู่ระบบ</a> ก่อนสั่งซื้อ</div>' : '') +
      '</div>';

    content.innerHTML =
      '<div class="cart-layout">' +
        '<div class="cart-items">' + itemsHtml + '</div>' +
        summaryHtml +
      '</div>';

    updateCartBadge();
  }

  function changeItemQty(key, delta) {
    var cart = getCart();
    var item = cart.find(function (i) { return i.key === key; });
    if (!item) return;
    item.qty = Math.max(1, item.qty + delta);
    saveCart(cart);
    render();
  }

  function removeItem(key) {
    var cart = getCart().filter(function (i) { return i.key !== key; });
    saveCart(cart);
    render();
    showToast('ลบสินค้าออกจากตะกร้าแล้ว', 'success');
  }

  function placeOrder() {
    var user = getCurrentUser();
    if (!user) {
      showToast('กรุณาเข้าสู่ระบบก่อนสั่งซื้อ', 'error');
      setTimeout(function () { window.location.href = 'login.html'; }, 1000);
      return;
    }

    var cart = getCart();
    if (cart.length === 0) return;

    var subtotal = calcSubtotal(cart);
    var shipping = subtotal >= SHIPPING_THRESHOLD ? 0 : SHIPPING_FEE;
    var total = subtotal + shipping;

    var btn = document.getElementById('checkoutBtn');
    btn.disabled = true;
    btn.textContent = 'กำลังสั่งซื้อ...';

    fetch(API_BASE + '/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user: user.username,
        items: cart.map(function (item) {
          return { id: item.id, name: item.name, price: item.price, qty: item.qty, color: item.color, size: item.size };
        }),
        total: total
      })
    })
    .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
    .then(function (result) {
      if (!result.ok) {
        showToast(result.data.error || 'สั่งซื้อไม่สำเร็จ', 'error');
        btn.disabled = false;
        btn.textContent = 'ยืนยันสั่งซื้อ';
        return;
      }
      saveCart([]);
      showToast('✅ สั่งซื้อสำเร็จ! เลขที่ออเดอร์ ' + result.data.order.id, 'success');
      setTimeout(function () { window.location.href = 'home.html'; }, 1800);
    })
    .catch(function () {
      showToast('เชื่อมต่อ server ไม่ได้ ตรวจสอบว่ารัน backend อยู่', 'error');
      btn.disabled = false;
      btn.textContent = 'ยืนยันสั่งซื้อ';
    });
  }

  render();
</script>

</body>
</html>
